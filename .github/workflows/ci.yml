name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end flow against mock Serble
        run: |
          MOCK_SERBLE=1 GROW_SCALE=0.001 PORT=8090 PUBLIC_URL=http://localhost:8090 DATA_DIR=$RUNNER_TEMP/data npx tsx server/index.ts > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8090/healthz && break; sleep 1; done
          node test/flow.mjs || (cat server.log; exit 1)

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: GIT_SHA=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: image
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the published image on a root-owned data volume and play through the game
        env:
          REPO: ${{ github.repository }}
        run: |
          sudo mkdir -p /srv/pollen-data && sudo chown root:root /srv/pollen-data && sudo chmod 755 /srv/pollen-data
          docker run -d --name pollen --network host -v /srv/pollen-data:/data -e MOCK_SERBLE=1 -e GROW_SCALE=0.001 -e PORT=8090 \
            -e PUBLIC_URL=http://localhost:8090 -e SESSION_SECRET=ci ghcr.io/${REPO,,}:sha-${GITHUB_SHA::7}
          for i in $(seq 1 30); do curl -sf localhost:8090/healthz && break; sleep 1; done
          docker exec pollen uname -m
          test "$(docker exec pollen sh -c 'grep ^Uid /proc/1/status' | awk '{print $2}')" = 1000 || (echo "app is not running as node"; exit 1)
          node test/flow.mjs || (docker logs pollen; exit 1)
          ls -ln /srv/pollen-data

  # Redeploys production through Komodo's API once the image has passed the smoke tests. The
  # runner joins the owner's tailnet as an ephemeral node only for this job. Skipped until the
  # secrets exist.
  deploy:
    needs: smoke
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production
    env:
      HAS_SECRETS: ${{ secrets.KOMODO_API_KEY != '' && secrets.TS_AUTHKEY != '' }}
    steps:
      - name: Skip (Komodo secrets not configured)
        if: env.HAS_SECRETS != 'true'
        run: echo "Komodo deploy secrets not set; production will update on Komodo's own poll."
      - uses: tailscale/github-action@v3
        if: env.HAS_SECRETS == 'true'
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: Redeploy on Komodo
        if: env.HAS_SECRETS == 'true'
        env:
          KOMODO_URL: ${{ secrets.KOMODO_URL }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          # "deployment:<name>" or "stack:<name>"
          KOMODO_TARGET: ${{ vars.KOMODO_TARGET || 'deployment:pollen' }}
        run: |
          kind="${KOMODO_TARGET%%:*}"; name="${KOMODO_TARGET#*:}"
          if [ "$kind" = stack ]; then body="{\"type\":\"DeployStack\",\"params\":{\"stack\":\"$name\"}}";
          else body="{\"type\":\"Deploy\",\"params\":{\"deployment\":\"$name\"}}"; fi
          resp=$(curl -fsS --retry 3 --retry-delay 5 -X POST "${KOMODO_URL%/}/execute" \
            -H "Content-Type: application/json" -H "X-Api-Key: $KOMODO_API_KEY" -H "X-Api-Secret: $KOMODO_API_SECRET" \
            -d "$body")
          id=$(echo "$resp" | jq -r '._id["$oid"] // ._id // empty')
          echo "Komodo update: ${id:-unknown}"
          # Follow the update to its end and report each stage. This repo's logs are public, and
          # Komodo stage logs can contain the container's environment, so print only stage names
          # and results, and a failed stage's error output with any NAME=value redacted.
          for i in $(seq 1 36); do
            [ -z "$id" ] && break
            u=$(curl -fsS -X POST "${KOMODO_URL%/}/read" -H "Content-Type: application/json" \
              -H "X-Api-Key: $KOMODO_API_KEY" -H "X-Api-Secret: $KOMODO_API_SECRET" \
              -d "{\"type\":\"GetUpdate\",\"params\":{\"id\":\"$id\"}}" || true)
            status=$(echo "$u" | jq -r '.status // empty')
            if [ "$status" = "Complete" ]; then
              echo "$u" | jq -r '"Komodo deploy finished: success=\(.success)", (.logs[]? | "  stage \(.stage): success=\(.success)")'
              echo "$u" | jq -r '.logs[]? | select(.success == false) | .stderr // ""' \
                | grep -iE 'error|denied|not found|manifest|pull|timeout' \
                | sed -E 's/[A-Za-z_][A-Za-z0-9_]*=[^ ]*/<redacted>/g' | cut -c1-300 | head -20 || true
              [ "$(echo "$u" | jq -r '.success')" = "true" ] || exit 1
              break
            fi
            sleep 5
          done
      - name: Wait for production to serve this build
        if: env.HAS_SECRETS == 'true'
        run: |
          for i in $(seq 1 60); do
            v=$(curl -s https://pollinate.garden/healthz | jq -r .version 2>/dev/null || true)
            [ "$v" = "$GITHUB_SHA" ] && { echo "pollinate.garden is serving $GITHUB_SHA"; exit 0; }
            sleep 5
          done
          echo "pollinate.garden is serving '${v}', expected $GITHUB_SHA"; exit 1
