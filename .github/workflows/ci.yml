name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end flow against mock Serble
        run: |
          MOCK_SERBLE=1 GROW_SCALE=0.001 PORT=8090 PUBLIC_URL=http://localhost:8090 DATA_DIR=$RUNNER_TEMP/data npx tsx server/index.ts > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8090/healthz && break; sleep 1; done
          node test/flow.mjs || (cat server.log; exit 1)

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tell Komodo to redeploy
        env:
          DEPLOY_WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        if: env.DEPLOY_WEBHOOK != ''
        run: |
          BODY='{"ref":"refs/heads/main"}'
          SIG="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" | sed 's/^.* //')"
          curl -fsS -X POST -H "Content-Type: application/json" -H "X-Hub-Signature-256: $SIG" -d "$BODY" "$DEPLOY_WEBHOOK"

  arm64-smoke:
    needs: image
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the published arm64 image and play through the game
        run: |
          docker run -d --name pollen --network host -e MOCK_SERBLE=1 -e GROW_SCALE=0.001 -e PORT=8090 \
            -e PUBLIC_URL=http://localhost:8090 -e SESSION_SECRET=ci ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA::7}
          docker exec pollen uname -m
          for i in $(seq 1 30); do curl -sf localhost:8090/healthz && break; sleep 1; done
          node test/flow.mjs || (docker logs pollen; exit 1)
